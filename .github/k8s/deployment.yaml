apiVersion: apps/v1
kind: Deployment
metadata:
  name: fcg-games
  namespace: fcg
  labels:
    app: fcg-games

spec:
  replicas: 2

  selector:
    matchLabels:
      app: fcg-games

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: fcg-games
        azure.workload.identity/use: "true"

    spec:
      serviceAccountName: sa-fcg-games

      imagePullSecrets:
        - name: acr-secret

      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "fcg-games-secrets"

      containers:
        - name: fcg-games

          image: fcgregistry-a2fjbegugxadcfac.azurecr.io/fcg-games:latest

          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          envFrom:
            - secretRef:
                name: fcg-games-secret

          volumeMounts:
            - name: secrets-store
              mountPath: "/mnt/secrets"
              readOnly: true

          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"

            limits:
              memory: "256Mi"
              cpu: "500m"

          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
              scheme: HTTP

            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
              scheme: HTTP

            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
