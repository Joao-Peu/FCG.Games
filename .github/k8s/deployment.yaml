apiVersion: apps/v1
kind: Deployment
metadata:
  name: fcg-games
  namespace: fcg
  labels:
    app: fcg-games
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fcg-games
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: fcg-games
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: sa-fcg-games
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "fcg-games-secrets"
      containers:
        - name: fcg-games
          image: fcgregistry.azurecr.io/fcg-games:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: secrets-store
              mountPath: "/mnt/secrets"
              readOnly: true
          envFrom:
            - secretRef:
                name: fcg-games-secret
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
